<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JulianaCard - Solicitação</title>
    <style>
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #18181f;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #292933;
        }
        h1 { color: #ff007f; margin-bottom: 5px; }
        .subtitulo { color: #79798c; font-size: 14px; margin-bottom: 25px; }
        .campo { text-align: left; margin-bottom: 15px; }
        label { display: block; color: #a8a8b3; font-size: 14px; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0f0f12;
            color: white;
            border: 1px solid #292933;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #ff007f; }
        button {
            background-color: #ff007f;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
        }
        #resultadoBox {
            display: none;
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background-color: #20202c;
        }
        .btn-whatsapp { background-color: #25d366; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>💳 JulianaCard</h1>
        <div class="subtitulo">Solicite o cartão da nossa loja em 1 minuto</div>

        <div class="campo">
            <label>Seu Nome Completo:</label>
            <input type="text" id="nomeCliente" placeholder="Digite seu nome">
        </div>

        <div class="campo">
            <label>Seu CPF:</label>
            <input type="text" id="cpfCliente" placeholder="000.000.000-00">
        </div>

        <div class="campo">
            <label>Renda Mensal (R$):</label>
            <input type="number" id="rendaCliente" placeholder="Ex: 2500">
        </div>

        <button onclick="analisarCredito()">🚀 Enviar Proposta</button>

        <div id="resultadoBox">
            <h3 id="statusTexto"></h3>
            <p id="limiteTexto"></p>
            <button class="btn-whatsapp" onclick="enviarWhatsApp()">📲 Enviar pelo WhatsApp</button>
        </div>
    </div>

    <script>
        let msgWhatsApp = "";

        async function analisarCredito() {
            const nome = document.getElementById("nomeCliente").value;
            const cpf = document.getElementById("cpfCliente").value;
            const renda = document.getElementById("rendaCliente").value;
            
            const resultadoBox = document.getElementById("resultadoBox");
            const statusTexto = document.getElementById("statusTexto");
            const limiteTexto = document.getElementById("limiteTexto");

            try {
                const resposta = await fetch('http://localhost:3000/api/analisar-credito', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, cpf, renda })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    alert(dados.erro);
                    return;
                }

                resultadoBox.style.display = "block";

                if (dados.status === "RECUSADO") {
                    statusTexto.innerText = "❌ Proposta Recusada";
                    statusTexto.style.color = "#ff3333";
                    limiteTexto.innerText = dados.mensagem;
                    
                    msgWhatsApp = `Olá! A proposta da loja *JulianaCard* para o cliente *${dados.cliente}* (CPF: ${dados.cpf}) foi analisada.\n\nStatus: ❌ Recusada de acordo com a renda atual.`;
                } else {
                    statusTexto.innerText = "🎉 PARABÉNS! Cartão Aprovado!";
                    statusTexto.style.color = "#00e676";
                    limiteTexto.innerText = dados.mensagem;

                    msgWhatsApp = `🔥 *LOJA JULIANACARD - NOVO CARTÃO APROVADO!* \n\n👤 *Cliente:* ${dados.cliente}\n🪪 *CPF:* ${dados.cpf}\n💳 *Limite Liberado:* R$ ${dados.limiteAprovado.toFixed(2)}\n\n_Parabéns pela parceria!_`;
                }
            } catch (erro) {
                alert("Erro ao conectar com o servidor. Verifique se a API está rodando.");
            }
        }

        function enviarWhatsApp() {
            const textoCodificado = encodeURIComponent(msgWhatsApp);
            const linkWhatsApp = `https://whatsapp.com{textoCodificado}`;
            window.open(linkWhatsApp, '_blank');
        }
    </script>

</body>
</html>
